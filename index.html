<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виртуальная Девушка: ИИ Чат</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .content {
            flex: 1;
            margin-top: 80px;
            padding: 20px;
            display: none; /* Скрыто до завершения анимации линии загрузки */
        }
        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        p {
            color: #cccccc;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            color: #ffffff;
            background-color: #ff3366;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #e02454;
        }
        
        /* Стили для сообщения об ошибке сети */
        .error-message {
            display: none;
            color: #ff4a4a;
            background-color: #241414;
            border: 1px solid #ff4a4a;
            padding: 15px;
            border-radius: 8px;
            max-width: 400px;
            margin: 20px auto;
            font-weight: bold;
        }

        /* Контейнер экрана предзагрузки */
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* Надпись над линией загрузки */
        .loader-text {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Горизонтальная линия загрузки */
        .progress-bar-container {
            width: 250px;
            height: 4px;
            background-color: #2a2a2a;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .progress-line {
            width: 0%;
            height: 100%;
            background-color: #ff3366;
            position: absolute;
            top: 0;
            left: 0;
            animation: loadProgress 1.5s ease-in-out forwards;
        }

        /* Анимация заполнения полосы */
        @keyframes loadProgress {
            0% { width: 0%; }
            50% { width: 60%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Экран с полосой загрузки и обновленным текстом -->
    <div class="loader-container" id="loader">
        <div class="loader-text">Идет подключение к ИИ чату...</div>
        <div class="progress-bar-container">
            <div class="progress-line"></div>
        </div>
    </div>

    <!-- Основной контент страницы -->
    <div class="content" id="main-content">
        <h1>Виртуальная Девушка: ИИ Чат</h1>
        <p id="sub-text">Нажмите на кнопку ниже, чтобы перейти к общению в чате:</p>
        
        <!-- Сообщение об ошибке при отсутствии интернета -->
        <div class="error-message" id="network-error">
            ⚠️ Отсутствует подключение к интернету. Проверьте сеть.
        </div>

        <!-- Кнопка с целевой ссылкой перехода -->
        <a href="https://wildgrl.space/p/x-go6mmb1jg" class="btn" id="chat-btn" target="_blank">Перейти к персонажу</a>
    </div>

    <script>
        // Переключение экрана после завершения линии загрузки
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                checkNetworkStatus();
            }, 1500); // 1.5 секунды анимации загрузки
        });

        const chatBtn = document.getElementById('chat-btn');
        const errorMsg = document.getElementById('network-error');
        const subText = document.getElementById('sub-text');

        // Логика проверки интернет-соединения
        function checkNetworkStatus() {
            if (navigator.onLine) {
                chatBtn.style.display = 'inline-block';
                subText.style.display = 'block';
                errorMsg.style.display = 'none';
            } else {
                chatBtn.style.display = 'none';
                subText.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        }

        // Автоматическое отслеживание изменений сети
        window.addEventListener('online', checkNetworkStatus);
        window.addEventListener('offline', checkNetworkStatus);
    </script>
</body>
</html>
