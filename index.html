<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виртуальная Девушка: ИИ Чат</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .content {
            flex: 1;
            margin-top: 80px;
            padding: 20px;
            display: none; /* Скрыто изначально для демонстрации загрузки */
        }
        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        p {
            color: #cccccc;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            color: #ffffff;
            background-color: #ff3366;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #e02454;
        }
        
        /* Стили для сообщения об ошибке сети */
        .error-message {
            display: none;
            color: #ff4a4a;
            background-color: #241414;
            border: 1px solid #ff4a4a;
            padding: 15px;
            border-radius: 8px;
            max-width: 400px;
            margin: 20px auto;
            font-weight: bold;
        }

        /* Анимированный прелоадер */
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #ff3366;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            padding: 20px;
            background-color: #1a1a1a;
            font-size: 14px;
        }
        footer a {
            color: #aaaaaa;
            text-decoration: none;
            transition: color 0.3s;
        }
        footer a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Элемент анимированной загрузки -->
    <div class="loader-container" id="loader">
        <div class="spinner"></div>
    </div>

    <div class="content" id="main-content">
        <h1>Виртуальная Девушка: ИИ Чат</h1>
        <p id="sub-text">Нажмите на кнопку ниже, чтобы перейти к общению в чате:</p>
        
        <!-- Сообщение об ошибке (показывается только если нет интернета) -->
        <div class="error-message" id="network-error">
            ⚠️ Отсутствует подключение к интернету. Проверьте сеть.
        </div>

        <!-- Основная кнопка перехода -->
        <a href="https://wildgrl.space" class="btn" id="chat-btn" target="_blank">Перейти к персонажу</a>
    </div>

    <footer>
        <a href="#" target="_blank">Политика конфиденциальности</a>
    </footer>

    <script>
        // Функция скрытия анимации загрузки и проверки сети
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                checkNetworkStatus();
            }, 1500); // 1.5 секунды анимации загрузки
        });

        const chatBtn = document.getElementById('chat-btn');
        const errorMsg = document.getElementById('network-error');
        const subText = document.getElementById('sub-text');

        function checkNetworkStatus() {
            if (navigator.onLine) {
                chatBtn.style.display = 'inline-block';
                subText.style.display = 'block';
                errorMsg.style.display = 'none';
            } else {
                chatBtn.style.display = 'none';
                subText.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        }

        // Отслеживание изменений статуса сети в реальном времени
        window.addEventListener('online', checkNetworkStatus);
        window.addEventListener('offline', checkNetworkStatus);
    </script>
</body>
</html>
